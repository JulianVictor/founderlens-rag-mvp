name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets are referenced: Stage 1 needs no OpenAI credentials or
    # runtime models, and CI never downloads the financial documents.
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install package (editable)
        run: python -m pip install -e .

      - name: Dependency integrity check
        run: python -m pip check

      - name: Package entry point
        run: python -m founderlens

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy (strict)
        run: python -m mypy src tests

      - name: pytest with coverage
        run: python -m pytest -q --cov=founderlens --cov-report=term-missing

      # Structural validation of the committed evaluation dataset against the
      # committed manifest. Needs no PDFs. Corpus PDF validation is local-only.
      - name: Evaluation dataset validation
        run: python -m founderlens.evaluation.validate
