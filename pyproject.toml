[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "founderlens"
dynamic = ["version"]
description = "Evidence-grounded RAG research system over a fixed corpus of public financial documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added only by the commit that first uses them and
# pinned exactly for reproducibility. Development tools live in
# requirements-dev.txt (single source of truth, pinned).
dependencies = [
    # PDF validity checks and page counts (Commit 1.2) and raw page-text
    # extraction (Commit 2.1). 1.28.x has no transitive dependencies; 2.x pulls
    # in onnxruntime/numpy/networkx, which this project does not need.
    # License: AGPL-3.0 or Artifex commercial — see README.
    "pymupdf==1.28.2",
    # BM25Okapi lexical retrieval baseline (Commit 3.1). Pure Python; its only
    # dependency is NumPy (unpinned upstream). License: Apache-2.0.
    "rank-bm25==0.2.2",
    # Required by rank-bm25 for score arrays; pinned here because rank-bm25
    # does not pin it. Has cp312 Windows wheels. License: BSD-3-Clause.
    "numpy==2.5.4",
    # Local chunk embeddings (Commit 3.2): sentence-transformers/all-MiniLM-L6-v2
    # at a pinned Hugging Face revision, CPU inference. Mutually compatible set,
    # verified with pip check on CPython 3.12; works with numpy 2.5.4 unchanged.
    # sentence-transformers also pulls scipy and scikit-learn (unpinned).
    # Licenses: Apache-2.0 (sentence-transformers, transformers, tokenizers,
    # huggingface-hub); torch is BSD-style (see its metadata).
    "sentence-transformers==6.2.0",
    "transformers==5.22.1",
    "tokenizers==0.23.3",
    "huggingface-hub==2.4.0",
    # CPU builds: the Windows/macOS PyPI wheels are CPU-only; on Linux install
    # torch==2.15.0 from https://download.pytorch.org/whl/cpu first (as CI does),
    # otherwise pip pulls the CUDA build and several GB of NVIDIA libraries.
    "torch==2.15.0",
    # LLM provider (Commit 5.1): official OpenAI Python SDK, Responses API.
    # 3.55.0 is the latest stable release (verified with pip check on CPython
    # 3.12); it adds only jiter and sniffio and uses the already-installed
    # httpx2, anyio and pydantic. License: Apache-2.0.
    "openai==3.55.0",
    # Typed structured-output schemas (Commit 5.1). Already installed
    # transitively; declared because generation imports it directly.
    # License: MIT.
    "pydantic==2.14.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

[tool.setuptools.dynamic]
version = { attr = "founderlens.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # prefer pathlib
    "PT",   # pytest style
    "RUF",  # ruff-specific correctness rules
]

[tool.ruff.lint.isort]
known-first-party = ["founderlens"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# PyMuPDF ships py.typed but leaves some public functions unannotated
# (e.g. pymupdf.open, TOOLS.*). Exempt only calls into that package from
# disallow_untyped_calls; everything else stays fully strict.
untyped_calls_exclude = ["pymupdf"]

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers from the tests package
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["founderlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
