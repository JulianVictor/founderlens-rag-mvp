[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "founderlens"
dynamic = ["version"]
description = "Evidence-grounded RAG research system over a fixed corpus of public financial documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added only by the commit that first uses them and
# pinned exactly for reproducibility. Development tools live in
# requirements-dev.txt (single source of truth, pinned).
dependencies = [
    # PDF validity checks and page counts (Commit 1.2) and raw page-text
    # extraction (Commit 2.1). 1.28.x has no transitive dependencies; 2.x pulls
    # in onnxruntime/numpy/networkx, which this project does not need.
    # License: AGPL-3.0 or Artifex commercial — see README.
    "pymupdf==1.28.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

[tool.setuptools.dynamic]
version = { attr = "founderlens.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # prefer pathlib
    "PT",   # pytest style
    "RUF",  # ruff-specific correctness rules
]

[tool.ruff.lint.isort]
known-first-party = ["founderlens"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# PyMuPDF ships py.typed but leaves some public functions unannotated
# (e.g. pymupdf.open, TOOLS.*). Exempt only calls into that package from
# disallow_untyped_calls; everything else stays fully strict.
untyped_calls_exclude = ["pymupdf"]

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers from the tests package
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["founderlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
